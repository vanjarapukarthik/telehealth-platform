# Telehealth Live — Nginx on EC2 (Ubuntu)
# Copy to /etc/nginx/sites-available/telehealth and symlink to sites-enabled.
# Adjust root path to where you uploaded frontend/dist contents.
#
# Backend (Node) must listen on 127.0.0.1:3000 — set HOST=127.0.0.1 in backend .env

server {
    listen 80;
    server_name _;

    root /home/ubuntu/app/telehealth/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST + same-origin API (Vite: VITE_API_URL empty → /api/...)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live chat (Socket.IO)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Doctor dashboard: browser → Node RTMP ingest (WebSocket)
    location /stream-ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (optional: expose via Nginx or curl localhost on instance)
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
    }
}
